apiVersion: v1
kind: Pod
metadata:
  name: test-azurefile-pod
spec:
  containers:
  - name: test-container
    image: mcr.microsoft.com/cbl-mariner/base/core:2.0
    command: ["/bin/sh"]
    args: ["-c", "echo 'Hello from Azure Files Entra ID' > /mnt/azurefile/test.txt && sleep 3600"]
    volumeMounts:
    - name: azurefile-volume
      mountPath: /mnt/azurefile
  volumes:
  - name: azurefile-volume
    persistentVolumeClaim:
      claimName: pvc-azurefile-entraid